
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NeuArchive | Registrar</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body class="auth-page">

    <main class="auth-container">

        <a href="Home.html" class="auth-logo">NEUARCHIVE</a>

        <section class="auth-card">

            <div class="auth-heading">
                <span class="auth-subtitle">CRIE SUA CONTA</span>

                <h1>Registrar</h1>

                <p>
                    Crie sua conta e comece a organizar
                    seus arquivos em um só lugar.
                </p>
            </div>

            <form action="/register" method="post">

                <div class="form-group">
                    <label for="username">Nome de usuário</label>
                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Digite seu usuário"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="email">E-mail</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Digite seu e-mail"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Senha</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Crie uma senha"
                        required
                    >
                </div>

                <button type="submit" class="auth-button">
                    Criar conta →
                </button>

            </form>

            <div class="auth-footer">
                <p>Já possui uma conta?</p>
                <a href="Login.html">Faça login</a>
            </div>

        </section>

        <a href="Home.html" class="back-home">
            ← Voltar para o início
        </a>

    </main>

</body>
</html>
