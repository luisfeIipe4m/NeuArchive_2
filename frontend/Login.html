
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NeuArchive | Login</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body class="auth-page">

    <main class="auth-container">

        <a href="Home.html" class="auth-logo">NEUARCHIVE</a>

        <section class="auth-card">

            <div class="auth-heading">
                <span class="auth-subtitle">BEM-VINDO DE VOLTA</span>

                <h1>Login</h1>

                <p>
                    Acesse sua conta para visualizar
                    e organizar seus arquivos.
                </p>
            </div>

            <form action="/login" method="post">

                <div class="form-group">
                    <label for="username">Nome de usuário</label>
                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Digite seu usuário"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Senha</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Digite sua senha"
                        required
                    >
                </div>

                <div class="forgot-password">
                    <a href="#">Esqueceu sua senha?</a>
                </div>

                <button type="submit" class="auth-button">
                    Entrar →
                </button>

            </form>

            <div class="auth-footer">
                <p>Ainda não possui uma conta?</p>
                <a href="Register.html">Criar uma conta</a>
            </div>

        </section>

        <a href="Home.html" class="back-home">
            ← Voltar para o início
        </a>

    </main>

</body>
</html>
